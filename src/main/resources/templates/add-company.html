<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Company</title>
<style type="text/css">
body {
font-family: Arial, sans-serif;
margin: 40px;
}
form {
width: 400px;
}
input {
width: 100%;
padding: 8px;
margin: 8px 0 15px;
box-sizing: border-box;
}
button {
padding: 10px 20px;
background-color: green;
color: white;
border: none;
cursor: pointer;
}
</style>
</head>
<body>
<h1>Add Company</h1>
<form th:action="@{/companies/save}" th:object="${company}"
method="post">
<label>Company Name : </label> <input type="text"
th:field="*{name}"required>
<label>Location : </label> <input type="text" th:field="*{location}" required>
<label>Industry : </label> <input type="text" th:field="*{industry}" required>
<label>Email : </label>
<input type="text" th:field="*{email}" required> <label>Phone : </label>
<input type="text" th:field="*{phone}" required>
<button type="submit">Save Company</button>
</form>
<br>
<a href="/companies">Back to Companies</a>
</body>
</html>
